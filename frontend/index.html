<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Online Store</h1>

    <div class="products">

        <div class="card">
            <h2>Product 1</h2>
            <p>Price: ₹500</p>
            <button onclick="addToCart('Product 1')">
                Add to Cart
            </button>
        </div>

        <div class="card">
            <h2>Product 2</h2>
            <p>Price: ₹800</p>
            <button onclick="addToCart('Product 2')">
                Add to Cart
            </button>
        </div>

    </div>

    <h2>Cart</h2>

    <ul id="cart"></ul>

    <script src="script.js"></script>

</body>
</html>
